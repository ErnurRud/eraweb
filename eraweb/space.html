<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a1a">
    <title>Космический Гонщик</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>">

    <script>
    (function() {
        try {
            var theme = localStorage.getItem('siteTheme') || 'dark';
            if (theme === 'light') {
                document.documentElement.classList.add('light');
            }
        } catch (e) {}
    })();
</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="space.css">
</head>
<body>
    <canvas id="stars"></canvas>

    <a href="index.html" class="back-btn">◄ НАЗАД</a>

    <button id="musicToggle" class="music-btn" title="Включить музыку">🔇</button>
    <button id="musicNext" class="music-next-btn" title="Следующий трек">⏭</button>
    <button id="themeToggle" title="Сменить тему">🌙</button>
    <main class="space-container">
        <h1 class="space-title glitch" data-text="SPACE RUNNER">SPACE RUNNER</h1>
        <p class="space-subtitle">&gt; уклоняйся, собирай, выживай</p>

        <!-- Кнопка магазина -->
        <button class="shop-open-btn" id="shopOpenBtn">
            🛒 МАГАЗИН <span class="shop-crystals">💎 <span id="shopCrystals">0</span></span>
        </button>

        <!-- HUD -->
        <div class="hud">
            <div class="hud-item">
                <span class="hud-label">СЧЁТ</span>
                <span class="hud-value" id="score">0</span>
            </div>
            <div class="hud-item">
                <span class="hud-label">РЕКОРД</span>
                <span class="hud-value" id="highScore">0</span>
            </div>
            <div class="hud-item">
                <span class="hud-label">💎</span>
                <span class="hud-value" id="crystals">0</span>
            </div>
            <div class="hud-item">
                <span class="hud-label">🛡️</span>
                <span class="hud-value" id="shield">0</span>
            </div>
        </div>

        <!-- Игровое поле -->
        <div class="canvas-wrapper" id="canvasWrapper">
            <canvas id="game" width="400" height="600"></canvas>

            <div class="overlay" id="overlay">
                <div class="overlay-content">
                    <h2 id="overlayTitle">ГОТОВ?</h2>
                    <p id="overlayText">Води пальцем / мышью<br>Корабль летит вверх и уклоняется</p>
                    <button id="startBtn" class="btn">▶ СТАРТ</button>
                </div>
            </div>
        </div>

        <!-- Кнопки управления -->
        <div class="controls">
            <button class="ctrl-btn" id="upBtn">▲</button>
            <button class="ctrl-btn fire" id="boostBtn">⚡ БУСТ</button>
            <button class="ctrl-btn" id="downBtn">▼</button>
        </div>

        <p class="hint">
            &gt; веди корабль пальцем / мышью &nbsp;|&nbsp; ПРОБЕЛ = буст &nbsp;|&nbsp; R = заново
        </p>
    </main>

    <!-- МОДАЛЬНОЕ ОКНО МАГАЗИНА -->
    <div class="shop-modal hidden" id="shopModal">
        <div class="shop-content">
            <div class="shop-header">
                <h2>🛒 МАГАЗИН</h2>
                <div style="display:flex;align-items:center;">
                    <div class="shop-balance">💎 <span id="shopBalance">0</span></div>
                    <button class="shop-close" id="shopClose">✕</button>
                </div>
            </div>
            <div class="shop-list" id="shopList"></div>
        </div>
    </div>

    <script src="music.js"></script>
    <script src="space.js"></script>
    <script src="theme.js"></script>
    <script src="nozoom.js"></script>
    <script src="achievements.js"></script>
</body>
</html>
