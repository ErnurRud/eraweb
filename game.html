<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0a1a">
    <title>◤ ЧЕРВЯК.EXE ◢</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👾</text></svg>">

    <script>
    (function() {
        try {
            var theme = localStorage.getItem('siteTheme') || 'dark';
            if (theme === 'light') {
                document.documentElement.classList.add('light');
            }
        } catch (e) {}
    })();
</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="game.css">
</head>
<body>
    <!-- Звёздный фон -->
    <canvas id="stars"></canvas>

    <!-- Кнопка назад -->
    <a href="index.html" class="back-btn">◄ НАЗАД</a>

    <button id="musicToggle" class="music-btn" title="Включить музыку">🔇</button>
    <button id="musicNext" class="music-next-btn" title="Следующий трек">⏭</button>
    <button id="themeToggle" title="Сменить тему">🌙</button>

    <main class="game-container">
        <h1 class="game-title glitch" data-text="ЧЕРВЯК.EXE">ЧЕРВЯК.EXE</h1>
        <p class="game-subtitle">&gt; свайп или стрелки для управления</p>

        <!-- HUD -->
        <div class="hud">
            <div class="hud-item">
                <span class="hud-label">СЧЁТ</span>
                <span class="hud-value" id="score">0</span>
            </div>
            <div class="hud-item">
                <span class="hud-label">РЕКОРД</span>
                <span class="hud-value" id="highScore">0</span>
            </div>
            <div class="hud-item">
                <span class="hud-label">УРОВЕНЬ</span>
                <span class="hud-value" id="level">1</span>
            </div>
        </div>

        <!-- Игровое поле -->
        <div class="canvas-wrapper" id="canvasWrapper">
            <canvas id="game" width="400" height="400"></canvas>

            <!-- Оверлей -->
            <div class="overlay" id="overlay">
                <div class="overlay-content">
                    <h2 id="overlayTitle">ГОТОВ?</h2>
                    <p id="overlayText">Свайпай по экрану или жми кнопку</p>
                    <button id="startBtn" class="btn">▶ ИГРАТЬ</button>
                </div>
            </div>
        </div>

        <!-- Кнопки управления (для мобилок) -->
        <div class="mobile-controls">
            <button class="arrow" data-dir="up">▲</button>
            <div class="row">
                <button class="arrow" data-dir="left">◄</button>
                <button class="arrow" data-dir="pause" id="pauseBtn">⏸</button>
                <button class="arrow" data-dir="right">►</button>
            </div>
            <button class="arrow" data-dir="down">▼</button>
        </div>

        <p class="hint">
            &gt; свайп по полю = поворот &nbsp;|&nbsp; ПРОБЕЛ = пауза &nbsp;|&nbsp; R = заново
        </p>
    </main>

    <script src="music.js"></script>
    <script src="game.js"></script>
    <script src="theme.js"></script>
    <script src="nozoom.js"></script>
    <script src="achievements.js"></script>
</body>
</html>
