<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a1a">
    <title>✅ Сообщение отправлено | ERNUR</title>

    <script>
        (function() {
            try {
                var theme = localStorage.getItem('siteTheme') || 'dark';
                if (theme === 'light') document.documentElement.classList.add('light');
            } catch (e) {}
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <style>
        /* Локальные стили только для этой страницы */
        .thanks-wrapper {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 100px 20px 40px;
            position: relative;
            z-index: 2;
        }

        .thanks-icon {
            font-size: 120px;
            margin-bottom: 30px;
            animation: thanksBounce 1.5s ease-in-out infinite;
            filter: drop-shadow(0 0 30px var(--neon-green));
        }

        @keyframes thanksBounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-20px) scale(1.1); }
        }

        .thanks-title {
            font-family: 'Press Start 2P', monospace;
            font-size: clamp(20px, 4vw, 32px);
            color: var(--neon-green);
            text-shadow:
                0 0 15px var(--neon-green),
                0 0 30px var(--neon-green);
            margin-bottom: 25px;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.04); }
        }

        .thanks-text {
            font-size: 22px;
            color: var(--text);
            max-width: 500px;
            line-height: 1.6;
            margin-bottom: 40px;
        }

        .thanks-text b {
            color: var(--neon-cyan);
            text-shadow: 0 0 10px var(--neon-cyan);
        }

        .thanks-actions {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .thanks-btn {
            font-family: 'Press Start 2P', monospace;
            font-size: 12px;
            padding: 16px 28px;
            background: transparent;
            color: var(--neon-cyan);
            border: 3px solid var(--neon-cyan);
            text-decoration: none;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
            display: inline-block;
        }

        .thanks-btn:hover,
        .thanks-btn:active {
            background: var(--neon-cyan);
            color: var(--bg);
            box-shadow: 0 0 25px var(--neon-cyan), 0 0 50px var(--neon-cyan);
            transform: translateY(-3px);
        }

        .thanks-btn.pink {
            color: var(--neon-pink);
            border-color: var(--neon-pink);
            box-shadow: 0 0 15px rgba(255, 46, 151, 0.3);
        }

        .thanks-btn.pink:hover {
            background: var(--neon-pink);
            color: var(--bg);
            box-shadow: 0 0 25px var(--neon-pink), 0 0 50px var(--neon-pink);
        }
    </style>
</head>
<body>
    <canvas id="stars"></canvas>

    <main class="thanks-wrapper">
        <div class="thanks-icon">✅</div>

        <h1 class="thanks-title">СООБЩЕНИЕ ОТПРАВЛЕНО!</h1>

        <p class="thanks-text">
            Спасибо за твоё сообщение! 💜<br>
            Я получил его на <b>ernurrud@gmail.com</b><br>
            и постараюсь ответить как можно скорее.
        </p>

        <div class="thanks-actions">
            <a href="index.html" class="thanks-btn">◄ НА ГЛАВНУЮ</a>
            <a href="index.html#contact" class="thanks-btn pink">✉ ЕЩЁ СООБЩЕНИЕ</a>
        </div>
    </main>

    <script src="nozoom.js"></script>
    <script src="theme.js"></script>
    <script src="music.js"></script>
    <script>
        // Простая анимация звёзд для страницы благодарности
        const canvas = document.getElementById('stars');
        const ctx = canvas.getContext('2d');
        let stars = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        function initStars() {
            stars = [];
            const count = Math.floor(window.innerWidth / 10);
            for (let i = 0; i < count; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 2 + 0.5,
                    speed: Math.random() * 0.3 + 0.05,
                    color: Math.random() > 0.5 ? '#39ff14' : '#00f0ff'
                });
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            stars.forEach(s => {
                s.y += s.speed;
                if (s.y > canvas.height) s.y = 0;
                ctx.fillStyle = s.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = s.color;
                ctx.fillRect(s.x, s.y, s.size, s.size);
            });
            requestAnimationFrame(animate);
        }

        resizeCanvas();
        initStars();
        animate();

        window.addEventListener('resize', () => {
            resizeCanvas();
            initStars();
        });
    </script>
</body>
</html>
